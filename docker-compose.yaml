# Qwen3.8-Flash-Next (huihui abliterated v2), 2x CMP 170HX 64GB
#
# Model:  UD-IQ4_XS, 93.7 GB on disk. 28.8 GB n-gram table stays in system RAM (input tensor,
#         a few KB read per token). The remaining ~65 GB of layers and experts now fit in VRAM
#         across both cards, so nothing runs on the CPU and PCIe Gen2 x8 barely matters.
# GPU 0:  gets ~80% of the model (+ KV cache). GPU 1 holds the rest plus the MTP draft head and
#         mmproj, leaving ~50 GB free for speaches / comfy.
# Access: only on llm_backend, at http://llama-server:8080 (Bifrost provider "llamacpp").
#
# First run:
#   cp .env.example .env                                  # fill in LLAMA_API_KEY
#   docker compose --profile download run --rm model-download
#   docker compose up -d
#
# Tuning: check the startup log for per-GPU memory. If GPU 0 runs out, raise the second number in
# --tensor-split; if you want more free VRAM on GPU 1, lower it.
services:
  llama-server:
    container_name: llama-server
    cpuset: '16-23'
    restart: always
    environment:
      - 'NVIDIA_VISIBLE_DEVICES=all'
      - 'LLAMA_API_KEY=${LLAMA_API_KEY}'
    volumes:
      - './models:/models:ro'
    networks:
      - llm_backend
    command:
      - --model
      - '/models/huihui/unsloth-UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf'
      - --alias
      - 'qwen3.8-flash-next'
      # Manual placement (--fit off): all layers on GPU, layer split across both cards.
      # Do not use row/tensor split: it would push every layer's traffic over the slow PCIe link.
      - --fit
      - 'off'
      - --n-gpu-layers
      - '999'
      - --split-mode
      - 'layer'
      - --main-gpu
      - '0'
      - --tensor-split
      - '56,14'
      # Read the CPU-side weights (n-gram table, ~29 GB) into RAM once at startup instead of
      # mmap-ing from Unraid's /mnt/user (FUSE) per token.
      - --load-mode
      - 'none'
      - --lazy-mode
      - 'off'
      # Only 12 of 48 layers have a KV cache (the rest are linear attention), so 256K context
      # at q8_0 is only about 3 GB.
      - --ctx-size
      - '262144'
      - --parallel
      - '2'
      - --kv-unified
      - --flash-attn
      - 'on'
      - --cache-type-k
      - 'q8_0'
      - --cache-type-v
      - 'q8_0'
      - --batch-size
      - '2048'
      - --ubatch-size
      - '1024'
      # CPU is no longer in the hot path.
      - --threads
      - '4'
      - --jinja
      - --temp
      - '1.0'
      - --top-k
      - '20'
      - --top-p
      - '0.95'
      - --min-p
      - '0.0'
      - --metrics
      # MTP speculative decoding, now enabled: the 4.1 GB draft head fits on the second GPU.
      # Compare tok/s and the acceptance rate in the log; try --spec-draft-n-max 2 or 3.
      # If it doesn't help, comment out this block.
      - --model-draft
      - '/models/unsloth/mtp-Qwen3.8-Flash-Next-Q8_0.gguf'
      - --spec-type
      - 'draft-mtp'
      - --spec-draft-n-max
      - '3'
      - --spec-draft-ngl
      - 'all'
      # Vision (screenshots in BenAgent/opencode). Costs about 1 GB VRAM.
      - --mmproj
      - '/models/huihui/mmproj-Qwen3.8-Flash-Next-BF16.gguf'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - 'net.unraid.docker.icon=https://docker-icons.int.idmedia.no/llama-cpp:latest'
    image: registry.int.idmedia.no/idmedia/docker/llama.cpp-cmp170hx:latest

  # One-shot downloader: docker compose --profile download run --rm model-download
  model-download:
    profiles: [download]
    environment:
      - 'HF_TOKEN=${HF_TOKEN:-}'
    volumes:
      - './models:/models'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        pip install -q -U "huggingface_hub[cli]"
        hf download huihui-ai/Huihui-Qwen3.8-Flash-Next-abliterated-v2-GGUF \
          --include "unsloth-UD-IQ4_XS/*.gguf" --include "mmproj-Qwen3.8-Flash-Next-BF16.gguf" \
          --local-dir /models/huihui
        hf download unsloth/Qwen3.8-Flash-Next-GGUF mtp-Qwen3.8-Flash-Next-Q8_0.gguf \
          --local-dir /models/unsloth
    labels:
      - 'net.unraid.docker.icon=https://docker-icons.int.idmedia.no/llama-cpp:latest'
    image: python:3.12-slim


networks:
  llm_backend:
    external: true
